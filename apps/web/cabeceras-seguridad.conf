# Cabeceras de seguridad de todas las respuestas (se incluye en cada location: un add_header dentro de una
# location anula los del server). Sin CSP por ahora: Leaflet, las teselas y Google Sign-In necesitan afinarla.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Solo tiene efecto por HTTPS (el túnel); en http://localhost el navegador la ignora.
add_header Strict-Transport-Security "max-age=86400" always;
# CSP: solo scripts propios (nada inline ni de otros dominios: un XSS no puede cargar código de fuera ni mandar la
# sesión a otro sitio). Estilos inline por Ionic; fuentes de Google; fotos de cualquier https (teselas del mapa y
# fotos de los planes); la API va por el mismo dominio. Los sha256 son los scripts inline de @vitejs/plugin-legacy
# (`cspHashes` del paquete): si se actualiza el plugin, cambian.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-MS6/3FCg4WjP9gwgaBGwLpRCY6fZBgwmhVCdrPrNf3E=' 'sha256-tQjf8gvb2ROOMapIxFvFAYBeUJ0v1HCbOcSmDNXGtDo=' 'sha256-w36slEqa9euNKxfvkw+LLGsDIr++3rsZXpZxtmRh8Aw=' 'sha256-+5XkZFazzJo8n0iOP4ti/cLCMUudTf//Mzkb7xNPXIc='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
