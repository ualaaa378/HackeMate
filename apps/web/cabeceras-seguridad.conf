# Cabeceras de seguridad de todas las respuestas (se incluye en cada location: un add_header dentro de una
# location anula los del server). Sin CSP por ahora: Leaflet, las teselas y Google Sign-In necesitan afinarla.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Solo tiene efecto por HTTPS (el túnel); en http://localhost el navegador la ignora.
add_header Strict-Transport-Security "max-age=86400" always;
