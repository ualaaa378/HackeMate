# El túnel de Cloudflare ya manda X-Forwarded-Proto: https; en localhost se usa el esquema real.
map $http_x_forwarded_proto $proto_reenviado {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 8080;
    # No dice la versión de nginx en errores ni en la cabecera Server
    server_tokens off;
    root /usr/share/nginx/html;

    # DNS interno de Docker. Con los nombres en variables, nginx los resuelve en cada
    # petición: la web arranca aunque api o bot estén caídos (y da 502 solo en esas rutas).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;
    set $bot http://bot:8001;

    # Fotos y audios que suben los vecinos y los publicadores
    client_max_body_size 20m;

    location = /health {
        include /etc/nginx/cabeceras-seguridad.conf;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # Una sola URL pública (túnel → web:8080): la web llama a la API en su mismo dominio
    # (VITE_API_URL=/) y Telegram/Meta/Twilio entran por /webhook/.
    location /api/ {
        include /etc/nginx/cabeceras-seguridad.conf;
        proxy_pass $api;
        # X-Internal-Token es solo entre servicios (el bot llama a api:8000 por dentro): desde fuera no entra nunca.
        proxy_set_header X-Internal-Token "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proto_reenviado;
        proxy_read_timeout 60s;
    }

    location /webhook/ {
        include /etc/nginx/cabeceras-seguridad.conf;
        proxy_pass $bot;
        proxy_set_header X-Internal-Token "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proto_reenviado;
        proxy_read_timeout 60s;
    }

    # Los assets llevan hash en el nombre: se pueden cachear sin miedo
    location /assets/ {
        include /etc/nginx/cabeceras-seguridad.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # APK de Android para descargar desde Mi perfil (carpeta descargas/ del repo, montada por el compose)
    location /descargas/ {
        include /etc/nginx/cabeceras-seguridad.conf;
        alias /usr/share/nginx/descargas/;
        types { application/vnd.android.package-archive apk; }
        add_header Cache-Control "no-cache";
        add_header Content-Disposition 'attachment; filename="Pueblos Unidos.apk"';
    }

    # Fallback a index.html para las rutas del router (/agenda, /evento/…)
    location / {
        include /etc/nginx/cabeceras-seguridad.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
