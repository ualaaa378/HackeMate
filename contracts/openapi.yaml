    post:
      tags: [publicadores]
      summary: El moderador marca como comprobados el DNI y la residencia del responsable
      description: |
        Pone `responsable.identidad_verificada` (por defecto `true`). Es uno de los requisitos para el nivel 2.
        Desmarcarla no baja el nivel por sí sola: para eso, `POST /publicadores/{id}/aprobar` con otro nivel.
