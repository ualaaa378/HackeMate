  /api/v1/publicadores/{id}/aprobar:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [publicadores]
      summary: El moderador aprueba (o rechaza) la entidad
      description: |
        También sirve para cambiar `nivel_confianza` de un publicador que ya está `aprobado` (con `aprobar: true`):
        la web lo usa para pasarlo a publicación automática (nivel 2) o devolverlo a publicación a mano (nivel 0).
        Solo hay dos modos (ver `enums.md`): el nivel 1 está obsoleto, se acepta por compatibilidad y se guarda como 0.
        En un publicador ya aprobado, si no se envía `nivel_confianza`, el nivel no cambia.

        Pasar a nivel 2 exige las reglas de `apps/web/src/admin/confianza.ts`, calculadas por la API:
        - responsable identificado: `responsable` con `dni` y `residencia` y `identidad_verificada = true`;
        - al menos 3 planes aprobados en los últimos 60 días (`actividad.planes_60_dias >= 3`);
        - ningún plan rechazado en los últimos 60 días (`actividad.rechazados_60_dias = 0`);
        - algún plan aprobado en los últimos 90 días (`actividad.ultimo_plan`).
        Si falta alguna, 409 `reglas_confianza_no_cumplidas` con `details.faltan` = lista de las que fallan
        (`identidad_verificada`, `planes_60_dias`, `rechazados_60_dias`, `ultimo_plan`). Pasar a mano (0) no exige nada.
      security: [{ bearer: [] }, { interno: [] }]
      x-implementado: true
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                aprobar: { type: boolean, default: true }
                nivel_confianza: { enum: [0, 1, 2], default: 0 }
                motivo: { type: [string, "null"] }
      responses:
        "200":
          description: Publicador
          content:
            application/json:
              schema: { $ref: "./schemas/publicador.json" }
        "401": { $ref: "#/components/responses/Error", description: "401 `no_autenticado` (sin sesión de moderador ni X-Internal-Token), `token_invalido` o `token_caducado`" }
        "403": { $ref: "#/components/responses/Error", description: "403 `rol_insuficiente` (la sesión no es de un moderador)" }
        "404": { $ref: "#/components/responses/Error", description: "404 `publicador_no_encontrado`" }
        "409": { $ref: "#/components/responses/Error", description: "409 `estado_invalido` (el publicador no está pendiente de aprobación ni aprobado, o se intenta rechazar uno ya aprobado; details.estado) o `reglas_confianza_no_cumplidas` (nivel 2 sin cumplir las reglas; details.faltan)" }

