  /api/v1/auth/demo:
    post:
      tags: [auth]
      summary: "Solo en modo demo (DEMO_MODE=true): sesión como un usuario o rol sin login"
      description: |
        Existe solo si la API arranca con `DEMO_MODE=true` (por defecto `false`); si no, responde 404.
        Sirve para que el panel y la app entren en la demo como la moderadora o como una vecina sin cuentas
        de Google. Con `usuario_id` da la sesión de ese usuario; con `rol`, la del usuario más antiguo con ese rol.
        Nunca da sesión de moderador (403 `demo_sin_moderador`): la moderación entra con `POST /auth/admin`.
        Nunca se activa fuera de la presentación.
      security: [{}]
      x-implementado: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                usuario_id: { type: string, format: uuid }
                rol: { enum: [vecino, publicador, moderador] }
      responses:
        "200":
          description: Sesión
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Token" }
        "403": { $ref: "#/components/responses/Error", description: "403 `demo_sin_moderador`" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /api/v1/usuarios:
    post:
      tags: [usuarios]
      summary: Alta de usuario (el bot la usa la primera vez que escribe un teléfono nuevo)
      security: [{ interno: [] }]
      x-implementado: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UsuarioCrear" }
      responses:
        "201":
          description: Usuario
          content:
            application/json:
              schema: { $ref: "./schemas/usuario.json" }
        "401": { $ref: "#/components/responses/Error", description: "401 `token_interno_invalido` (falta X-Internal-Token o no es correcto)" }
        "409": { $ref: "#/components/responses/Error", description: "409 `usuario_ya_existe` (details.usuario_id)" }
        "422": { $ref: "#/components/responses/Error", description: "422 `validacion` o `municipio_no_encontrado`" }

  /api/v1/usuarios/by-phone/{e164}:
    parameters:
      - { name: e164, in: path, required: true, schema: { $ref: "#/components/schemas/Telefono" } }
    get:
      tags: [usuarios]
      summary: Identidad a partir del teléfono (solo servicios internos)
      security: [{ interno: [] }]
      x-implementado: true
      responses:
        "200":
          description: Usuario
          content:
            application/json:
              schema: { $ref: "./schemas/usuario.json" }
        "401": { $ref: "#/components/responses/Error", description: "401 `token_interno_invalido` (falta X-Internal-Token o no es correcto)" }
        "404": { $ref: "#/components/responses/Error", description: "404 `usuario_no_encontrado`" }
        "422": { $ref: "#/components/responses/Error", description: "422 `telefono_invalido` (no está en formato E.164)" }

  /api/v1/usuarios/by-contacto/{contacto}:
    parameters:
      - name: contacto
        in: path
        required: true
        description: "+34… (WhatsApp; el + puede ir como %2B) o tg:<chat_id> (Telegram)"
        schema: { $ref: "#/components/schemas/Contacto" }
    get:
      tags: [usuarios]
      summary: Identidad a partir del contacto en cualquier canal (solo servicios internos)
      description: "`by-phone` sigue igual. Errores: 404 `usuario_no_encontrado`, 422 `contacto_invalido`."
      security: [{ interno: [] }]
      x-implementado: true
      responses:
        "200":
          description: Usuario
          content:
            application/json:
              schema: { $ref: "./schemas/usuario.json" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /api/v1/usuarios/vincular:
    post:
      tags: [usuarios]
      summary: Vincula el contacto de un canal con el teléfono (crea el usuario si no existe)
      description: |
        Si no hay usuario con ese teléfono lo crea (201); si lo hay, le asigna el id del canal (200).
        Si hay un publicador con ese teléfono, también se le asigna.
        Errores: 409 `contacto_en_uso` (el contacto ya es de otra persona), 422 `contacto_invalido`.
      security: [{ interno: [] }]
      x-implementado: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UsuarioVincular" }
      responses:
        "200":
          description: Usuario existente, ya vinculado
          content:
            application/json:
              schema: { $ref: "./schemas/usuario.json" }
        "201":
          description: Usuario creado y vinculado
          content:
            application/json:
              schema: { $ref: "./schemas/usuario.json" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /api/v1/usuarios/me:
    get:
      tags: [usuarios]
      summary: Perfil del usuario autenticado
      security: [{ bearer: [] }]
      x-implementado: true
      responses:
        "200":
          description: Usuario
          content:
            application/json:
              schema: { $ref: "./schemas/usuario.json" }
        "401": { $ref: "#/components/responses/Error" }
    patch:
      tags: [usuarios]
      summary: Editar preferencias (gustos, pueblo, formato de aviso…)
      security: [{ bearer: [] }]
      x-implementado: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UsuarioEditar" }
      responses:
        "200":
          description: Usuario
          content:
            application/json:
              schema: { $ref: "./schemas/usuario.json" }
        "401": { $ref: "#/components/responses/Error", description: "401 `no_autenticado`, `token_invalido` o `token_caducado`" }
        "409": { $ref: "#/components/responses/Error", description: "409 `telefono_en_uso` (ese teléfono ya es de otro usuario)" }
        "422": { $ref: "#/components/responses/Error", description: "422 `validacion` o `municipio_no_encontrado`" }

  /api/v1/usuarios/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      tags: [usuarios]
      summary: Editar las preferencias de un usuario desde el bot (gustos, pueblo, formato de aviso…)
      description: |
        Igual que `PATCH /usuarios/me`, pero para servicios internos: el bot guarda lo que la vecina le dice
        por chat («me gustan las rutas», «avísame con audios»). Solo cambia los campos que se envían.
        `/usuarios/me` sigue igual (su ruta es fija y no choca con `{id}`, que es un UUID).
      security: [{ interno: [] }]
      x-implementado: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UsuarioEditar" }
      responses:
        "200":
          description: Usuario
          content:
            application/json:
              schema: { $ref: "./schemas/usuario.json" }
        "401": { $ref: "#/components/responses/Error", description: "401 `token_interno_invalido` (falta X-Internal-Token o no es correcto)" }
        "404": { $ref: "#/components/responses/Error", description: "404 `usuario_no_encontrado`" }
        "409": { $ref: "#/components/responses/Error", description: "409 `telefono_en_uso` (ese teléfono ya es de otro usuario)" }
        "422": { $ref: "#/components/responses/Error", description: "422 `validacion` o `municipio_no_encontrado`" }

  /api/v1/estadisticas:
    get:
      tags: [estadisticas]
      summary: Datos del panel (actividades, importadas solas, asistencia, ocupación, solapamientos, tokens)
      security: [{ bearer: [] }, { interno: [] }]
      x-implementado: true
      parameters:
        - { name: desde, in: query, schema: { type: string, format: date-time } }
        - { name: hasta, in: query, schema: { type: string, format: date-time } }
        - { name: municipio, in: query, schema: { type: string } }
      responses:
        "200":
          description: Estadísticas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Estadisticas" }
        "401": { $ref: "#/components/responses/Error", description: "401 `no_autenticado`, `token_invalido` o `token_caducado` (sin sesión de moderador ni X-Internal-Token)" }
        "403": { $ref: "#/components/responses/Error", description: "403 `rol_insuficiente` (la sesión no es de un moderador)" }

  /api/v1/metrics/tokens:
    post:
      tags: [estadisticas]
      summary: El bot registra cada llamada a la IA (criterio «coste en tokens»)
      security: [{ interno: [] }]
      x-implementado: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MetricaTokens" }
      responses:
        "202": { description: Registrado }

  /api/v1/admin/bot/metricas:
    get:
      tags: [admin]
      summary: Cifras del bot para el panel de robustez (tokens por proveedor, últimas llamadas, cola, caída simulada)
      description: |
        La API llama a `bot GET /metrics` con su `X-Internal-Token` y devuelve el JSON tal cual, para no poner
        el token interno en el navegador.
      security: [{ bearer: [] }, { interno: [] }]
      x-implementado: true
      responses:
        "200":
          description: Métricas del bot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetricasBot" }
        "401": { $ref: "#/components/responses/Error", description: "401 `no_autenticado` (sin sesión de moderador ni X-Internal-Token), `token_invalido` o `token_caducado`" }
        "403": { $ref: "#/components/responses/Error", description: "403 `rol_insuficiente` (la sesión no es de un moderador)" }
        "502": { $ref: "#/components/responses/Error", description: "502 `bot_no_disponible` (el bot respondió con error; details.status)" }
        "503": { $ref: "#/components/responses/Error", description: "503 `bot_no_disponible` (el bot no responde)" }

  /api/v1/admin/bot/simular-caida:
    post:
      tags: [admin]
      summary: Activa o desactiva la caída simulada de la IA en el bot (demo de robustez)
      description: |
        La API reenvía el cuerpo a `bot POST /admin/simular-caida` con su `X-Internal-Token` y devuelve lo que
        responde el bot. Con la caída activa, el bot sigue funcionando solo con reglas.
      security: [{ bearer: [] }, { interno: [] }]
      x-implementado: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CaidaSimulada" }
      responses:
        "200":
          description: Estado de la caída simulada tras el cambio
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaidaSimulada" }
        "401": { $ref: "#/components/responses/Error", description: "401 `no_autenticado` (sin sesión de moderador ni X-Internal-Token), `token_invalido` o `token_caducado`" }
        "403": { $ref: "#/components/responses/Error", description: "403 `rol_insuficiente` (la sesión no es de un moderador)" }
        "422": { $ref: "#/components/responses/Error", description: "422 `validacion`" }
        "502": { $ref: "#/components/responses/Error", description: "502 `bot_no_disponible` (el bot respondió con error; details.status)" }
        "503": { $ref: "#/components/responses/Error", description: "503 `bot_no_disponible` (el bot no responde)" }

  /api/v1/admin/sugerencias:
    get:
      tags: [admin]
      summary: "N7: la IA propone planes nuevos a partir de los que tuvieron mucha participación"
      description: |
        La API elige los planes con más participación (ocupación, inscritos, lista de espera, asistencias y
        preguntas en el chat; publicados o finalizados) y se los pasa a `bot POST /ai/sugerir-eventos` (N8), que propone
        de 1 a 3 planes nuevos («repetir la Ruta Solidaria en primavera: se llenó y hubo 6 en lista de espera»);
        sus `propuestas` son los `items` de la respuesta.
        Si el bot no responde, la API propone por reglas (repetir el de más participación) y `proveedor_ia` vale
        `reglas`: nunca falla por la IA. No guarda nada: cada llamada calcula de nuevo. «Descartar» lo hace la web.
        La IA propone y una persona decide: nada se publica sin pasar por la bandeja.
      security: [{ bearer: [] }, { interno: [] }]
      x-implementado: true
      parameters:
        - { name: municipio, in: query, schema: { type: string }, description: "Solo planes de ese pueblo" }
        - { name: limite, in: query, schema: { type: integer, minimum: 1, maximum: 3, default: 3 } }
      responses:
        "200":
          description: Propuestas y los planes en que se basan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sugerencias" }
        "401": { $ref: "#/components/responses/Error", description: "401 `no_autenticado`, `token_invalido` o `token_caducado`" }
        "403": { $ref: "#/components/responses/Error", description: "403 `rol_insuficiente` (la sesión no es de un moderador)" }

  /api/v1/admin/sugerencias/borrador:
    post:
      tags: [admin]
      summary: "N7: [Crear borrador] convierte una propuesta en un plan que espera en la bandeja"
      description: |
        Crea el evento en `en_revision` con motivo «Propuesto por la IA a partir de …»: el moderador lo revisa,
        ajusta la fecha y lo que haga falta (`PATCH /eventos/{id}`) y lo aprueba (`POST /moderacion/{id}/decision`).
        Al aprobarlo se avisa a los interesados como a cualquier plan nuevo (A10).
      security: [{ bearer: [] }]
      x-implementado: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BorradorSugerencia" }
      responses:
        "201":
          description: Evento creado en la bandeja
          content:
            application/json:
              schema: { $ref: "./schemas/evento.json" }
        "401": { $ref: "#/components/responses/Error", description: "401 `no_autenticado`, `token_invalido` o `token_caducado`" }
        "403": { $ref: "#/components/responses/Error", description: "403 `rol_insuficiente` (la sesión no es de un moderador)" }
        "422": { $ref: "#/components/responses/Error", description: "422 `validacion` o `municipio_no_encontrado`" }

  # ---------------- bot (Flujo B) ----------------
  /webhook/twilio:
    servers: [{ url: http://localhost:8001 }]
    post:
      tags: [bot]
      summary: Entrada de WhatsApp (Twilio). Responde TwiML con acuse inmediato.
      security: [{}]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                From: { type: string }
                Body: { type: string }
                NumMedia: { type: integer }
                MediaUrl0: { type: string }
                MediaContentType0: { type: string }
                Latitude: { type: number }
                Longitude: { type: number }
      responses:
        "200":
          description: TwiML
          content:
            application/xml:
              schema: { type: string }

  /webhook/telegram:
    servers: [{ url: http://localhost:8001 }]
    post:
      tags: [bot]
      summary: Entrada de Telegram (Update de la Bot API). El usuario es `tg:<chat_id>`.
      description: Telegram envía la cabecera `X-Telegram-Bot-Api-Secret-Token` con el secreto registrado en setWebhook.
      security: [{}]
      x-implementado: true
      parameters:
        - { name: X-Telegram-Bot-Api-Secret-Token, in: header, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: Update de la Bot API de Telegram }
      responses:
        "200": { description: Recibido (se procesa en segundo plano) }

  /webhook/meta:
    servers: [{ url: http://localhost:8001 }]
    get:
      tags: [bot]
      summary: Verificación del webhook de WhatsApp Cloud API (Meta) con `hub.challenge`
      security: [{}]
      x-implementado: true
      parameters:
        - { name: hub.mode, in: query, schema: { type: string } }
        - { name: hub.verify_token, in: query, schema: { type: string } }
        - { name: hub.challenge, in: query, schema: { type: string } }
      responses:
        "200":
          description: Devuelve `hub.challenge`
          content:
            text/plain:
              schema: { type: string }
    post:
      tags: [bot]
      summary: Entrada de WhatsApp Cloud API (Meta). Firma en la cabecera `X-Hub-Signature-256`.
      security: [{}]
      x-implementado: true
      parameters:
        - { name: X-Hub-Signature-256, in: header, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: Notificación de webhook de WhatsApp Cloud API }
      responses:
        "200": { description: Recibido (se procesa en segundo plano) }

  /dev/mensaje:
    servers: [{ url: http://localhost:8001 }]
    post:
      tags: [bot]
      summary: Simulador de chat (web o tests). Devuelve lo que contestaría el bot.
      security: [{}]
      x-implementado: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [de, texto]
              properties:
                de: { type: string, description: "Contacto del remitente: +34… o tg:<chat_id>" }
                texto: { type: string }
      responses:
        "200":
          description: Respuestas del bot
          content:
            application/json:
              schema:
                type: object
                required: [respuestas]
                properties:
                  respuestas: { type: array }

  /notify:
    servers: [{ url: http://localhost:8001 }]
    post:
      tags: [bot]
      summary: La api pide enviar un aviso
      description: |
        Va a `contacto` si viene (p. ej. `tg:<chat_id>`) y si no a `telefono`. En WhatsApp, fuera de la ventana
        de 24 h, se usa `plantilla` + `parametros`; los demás canales envían `texto`.
      security: [{ interno: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "./schemas/notificacion.json" }
      responses:
        "200":
          description: Enviado
          content:
            application/json:
              schema:
                type: object
                required: [enviado]
                properties:
                  enviado: { type: boolean }

  /ai/extraer:
    servers: [{ url: http://localhost:8001 }]
    post:
      tags: [bot]
      summary: Texto → ExtraccionEvento
      security: [{ interno: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [texto]
              properties:
                texto: { type: string }
      responses:
        "200":
          description: Extracción
          content:
            application/json:
              schema: { $ref: "./schemas/extraccion_evento.json" }

  /ai/spam:
    servers: [{ url: http://localhost:8001 }]
    post:
      tags: [bot]
      summary: Puntuación de spam de un texto (evento o mensaje del chat)
      security: [{ interno: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [texto]
              properties:
                texto: { type: string }
                contexto: { enum: [evento, mensaje] }
                publicador_id: { type: [string, "null"], format: uuid }
      responses:
        "200":
          description: Resultado
          content:
            application/json:
              schema:
                type: object
                required: [score_spam, es_spam]
                properties:
                  score_spam: { type: number, minimum: 0, maximum: 1 }
                  es_spam: { type: boolean }
                  motivo: { type: [string, "null"] }
                  proveedor_ia: { type: string }
                  tipo:
                    enum: [ninguno, spam, fraude]
                    description: |
                      (N9, opcional) Qué es: `spam` (publicidad ajena, apuestas, cadenas, enlaces sospechosos) o
                      `fraude` (pide pago por adelantado, Bizum o datos bancarios, precios irreales, suplanta a un
                      ayuntamiento o asociación…). `ninguno` si es legítimo. `es_spam` es true en los dos casos, así
                      que quien no lea este campo sigue funcionando igual. El moderador ve el tipo en el motivo.

  /ai/responder-ficha:
    servers: [{ url: http://localhost:8001 }]
    post:
      tags: [bot]
      summary: Responde una pregunta usando solo la ficha del evento
      security: [{ interno: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [evento, pregunta]
              properties:
                evento: { $ref: "./schemas/evento.json" }
                pregunta: { type: string }
      responses:
        "200":
          description: Respuesta
          content:
            application/json:
              schema:
                type: object
                required: [puede_responder]
                properties:
                  puede_responder: { type: boolean, description: false = no está en la ficha, se deriva al organizador }
                  respuesta: { type: [string, "null"] }
                  proveedor_ia: { type: string }

  /ai/sugerir-eventos:
    servers: [{ url: http://localhost:8001 }]
    post:
      tags: [bot]
      summary: (N8) Propone planes nuevos a partir de los que más participación tuvieron
      description: |
        La llama la API (N7) con los planes con más participación (ocupación, inscritos, lista de espera, preguntas
        en el chat). Devuelve de 1 a `maximo` propuestas para los administradores, que deciden si crean el borrador.
        La IA solo propone y no inventa datos: cada propuesta dice en qué planes se basa (`basado_en`) y por qué.
        IA con FreeLLM primero; sin IA, propuestas por reglas (repetir el plan que más se llenó).
      security: [{ interno: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planes]
              properties:
                planes:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: object
                    required: [titulo, categoria, municipio, fecha_inicio, inscritos]
                    properties:
                      evento_id: { type: string, format: uuid }
                      titulo: { type: string }
                      categoria: { $ref: "#/components/schemas/Categoria" }
                      municipio: { type: string }
                      fecha_inicio: { type: string, format: date-time }
                      plazas_totales: { type: [integer, "null"], minimum: 0 }
                      inscritos: { type: integer, minimum: 0 }
                      lista_espera: { type: integer, minimum: 0, default: 0 }
                      preguntas_chat: { type: integer, minimum: 0, default: 0 }
                maximo: { type: integer, minimum: 1, maximum: 3, default: 3 }
      responses:
        "200":
          description: Propuestas (puede venir vacía si nada destaca)
          content:
            application/json:
              schema:
                type: object
                required: [propuestas]
                properties:
                  propuestas:
                    type: array
                    maxItems: 3
                    items:
                      type: object
                      required: [titulo, categoria, municipio, motivo]
                      properties:
                        titulo: { type: string, maxLength: 120 }
                        categoria: { $ref: "#/components/schemas/Categoria" }
                        municipio: { type: string }
                        fecha_aproximada: { type: [string, "null"], description: "Texto libre: «primavera», «mayo de 2027», «el próximo puente»" }
                        motivo: { type: string, description: "Por qué, con datos de los planes recibidos (se llenó, 6 en lista de espera…)" }
                        basado_en: { type: array, items: { type: string, format: uuid }, description: "evento_id de los planes en que se basa" }
                  proveedor_ia: { type: string }

  /ai/preferencias:
    servers: [{ url: http://localhost:8001 }]
    post:
      tags: [bot]
      summary: «Me gustan las rutas» → gustos estructurados
      security: [{ interno: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [texto]
              properties:
                texto: { type: string }
      responses:
        "200":
          description: Preferencias
          content:
            application/json:
              schema:
                type: object
                properties:
                  gustos: { type: array, items: { $ref: "#/components/schemas/Categoria" } }
                  etiquetas_interes: { type: array, items: { type: string } }
                  municipio: { type: [string, "null"] }
                  formato_aviso: { enum: [texto, audio] }

  /ai/embeddings:
    servers: [{ url: http://localhost:8001 }]
    post:
      tags: [bot]
      summary: (RAG) Textos → vectores para buscar planes por parecido
      description: |
        La llama la API para indexar los planes (`tipo: documento`) y para la pregunta del buscador (`tipo: consulta`).
        Cadena de proveedores: Gemini `gemini-embedding-001` (dimensión 768) y, si falla, NVIDIA `nemotron-3.5-embed-1b`.
        Solo se comparan vectores del mismo `modelo`: si cambia, la API vuelve a indexar.
        Sin proveedor disponible responde 503 y la API sigue buscando sin embeddings (reglas y palabras clave).
      security: [{ interno: [] }]
      x-implementado: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [textos]
              properties:
                textos:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { type: string, minLength: 1 }
                tipo: { enum: [documento, consulta], default: documento }
      responses:
        "200":
          description: Un vector por texto, en el mismo orden
          content:
            application/json:
              schema:
                type: object
                required: [modelo, dimension, vectores]
                properties:
                  modelo: { type: string, description: "Modelo que generó los vectores (p. ej. gemini-embedding-001)" }
                  dimension: { type: integer, minimum: 1 }
                  vectores:
                    type: array
                    items: { type: array, items: { type: number } }
        "401": { $ref: "#/components/responses/Error", description: "401 `token_interno_invalido`" }
        "503": { $ref: "#/components/responses/Error", description: "503: ningún proveedor de embeddings disponible (la API sigue sin embeddings)" }

  /ai/responder-agenda:
    servers: [{ url: http://localhost:8001 }]
    post:
      tags: [bot]
      summary: (RAG) Responde una pregunta sobre la agenda usando solo los planes que recibe
      description: |
        La llama la API (`POST /api/v1/buscar`) con los planes recuperados. Respuesta breve (2–4 frases) en español
        sencillo, solo con los planes recibidos: no inventa planes, fechas ni precios. `evento_ids` solo puede contener
        ids de `planes` (la API lo comprueba igualmente). Con `planes` vacío dice que no hay nada que encaje.
        Sin IA, respuesta por plantilla y `proveedor_ia: reglas`.
      security: [{ interno: [] }]
      x-implementado: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pregunta, planes]
              properties:
                pregunta: { type: string, minLength: 1, maxLength: 300 }
                planes:
                  type: array
                  minItems: 0
                  maxItems: 12
                  items: { $ref: "#/components/schemas/PlanContexto" }
                hoy: { type: string, format: date-time, description: "Fecha y hora de referencia para «este finde», «mañana»…" }
      responses:
        "200":
          description: Respuesta
          content:
            application/json:
              schema:
                type: object
                required: [respuesta, evento_ids, proveedor_ia]
                properties:
                  respuesta: { type: string }
                  evento_ids: { type: array, items: { type: string, format: uuid }, description: "Planes que nombra la respuesta (solo ids de `planes`)" }
                  proveedor_ia: { type: string }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    interno:
      type: apiKey
      in: header
      name: X-Internal-Token

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    Error:
      description: |
        Error con el formato común. Una ruta que no existe responde 404 con code `no_encontrado` (manejador genérico),
        distinto de los 404 de recurso inexistente (`evento_no_encontrado`, `publicador_no_encontrado`…).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Health:
      type: object
      required: [status, version]
      properties:
        status: { const: ok }
        version: { type: string }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, examples: [evento_no_encontrado, publicador_pausado, sin_plazas, evento_finalizado, sin_permiso, token_interno_invalido, no_encontrado, bot_no_disponible, reglas_confianza_no_cumplidas] }
            message: { type: string }
            details: { type: object }

    Telefono:
      type: string
      pattern: "^\\+[1-9][0-9]{6,14}$"
      description: E.164, p. ej. +34600000000

    Contacto:
      type: string
      pattern: "^(\\+[1-9][0-9]{6,14}|tg:-?[0-9]{1,20})$"
      description: |
        Dirección de contacto de un canal de mensajería: E.164 (+34600000000) = WhatsApp; `tg:<chat_id>` = Telegram.
        En la API, services/api/app/canales.py: añadir un canal es una entrada en su registro y una columna.
      examples: ["+34600000201", "tg:123456789"]

    Categoria:
      enum: [deportiva, cultural, fiestas, gastronomia, ludica, comercio]

    EstadoEvento:
      enum: [borrador, pendiente_confirmacion, en_revision, publicado, rechazado, cancelado, finalizado, archivado]

    Municipio:
      type: object
      required: [nombre, lat, lon]
      properties:
        nombre: { type: string }
        lat: { type: number }
        lon: { type: number }

    Pagina:
      type: object
      required: [items, total, page, size]
      properties:
        items: { type: array }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        size: { type: integer, minimum: 1 }

    PaginaEventos:
      allOf:
        - $ref: "#/components/schemas/Pagina"
        - properties:
            items: { type: array, items: { $ref: "./schemas/evento.json" } }

    PaginaLugares:
      allOf:
        - $ref: "#/components/schemas/Pagina"
        - properties:
            items: { type: array, items: { $ref: "./schemas/lugar.json" } }

    PaginaMensajes:
      allOf:
        - $ref: "#/components/schemas/Pagina"
        - properties:
            items: { type: array, items: { $ref: "./schemas/mensaje_evento.json" } }

    PaginaPublicadores:
      allOf:
        - $ref: "#/components/schemas/Pagina"
        - properties:
            items: { type: array, items: { $ref: "./schemas/publicador.json" } }

    PaginaPendientes:
      allOf:
        - $ref: "#/components/schemas/Pagina"
        - properties:
            items: { type: array, items: { $ref: "#/components/schemas/Pendiente" } }

    Pendiente:
      type: object
      required: [tipo, motivo]
      properties:
        tipo: { enum: [evento, publicador] }
        motivo: { type: string }
        score_spam: { type: [number, "null"] }
        evento: { $ref: "./schemas/evento.json" }
        publicador: { $ref: "./schemas/publicador.json" }

    EventoCrear:
      type: object
      required: [titulo, categoria, municipio, fecha_inicio]
      properties:
        titulo: { type: string, minLength: 3, maxLength: 120 }
        descripcion: { type: string }
        categoria: { $ref: "#/components/schemas/Categoria" }
        etiquetas: { type: array, items: { type: string } }
        municipio: { type: string }
        lugar: { type: [string, "null"] }
        lat: { type: [number, "null"], description: Si falta, se usan las del municipio }
        lon: { type: [number, "null"] }
        fecha_inicio: { type: string, format: date-time }
        fecha_fin: { type: [string, "null"], format: date-time }
        precio_eur: { type: [number, "null"], minimum: 0 }
        es_gratuito: { type: boolean }
        plazas_totales: { type: [integer, "null"], minimum: 0 }
        imagen_url: { type: [string, "null"], description: "URL http(s) o data URL de imagen (data:image/webp;base64,…) de hasta ~1,5 MB; si no, 422 imagen_invalida" }
        frase_portada: { type: [string, "null"], maxLength: 90, description: "Frase corta y pública para la portada del carrusel. Si llega vacía, la API puede pedírsela al bot" }
        datos_ayuntamiento:
          $ref: "#/components/schemas/DatosAyuntamiento"
        publicador_id: { type: [string, "null"], format: uuid }

    EventoEditar:
      type: object
      description: Todos los campos de EventoCrear son opcionales. `estado` solo lo cambia el moderador o el publicador para cancelar.
      properties:
        titulo: { type: string, minLength: 3, maxLength: 120 }
        descripcion: { type: string }
        categoria: { $ref: "#/components/schemas/Categoria" }
        etiquetas: { type: array, items: { type: string } }
        lugar: { type: [string, "null"] }
        lat: { type: [number, "null"] }
        lon: { type: [number, "null"] }
        fecha_inicio: { type: string, format: date-time }
        fecha_fin: { type: [string, "null"], format: date-time }
        precio_eur: { type: [number, "null"], minimum: 0 }
        es_gratuito: { type: boolean }
        plazas_totales: { type: [integer, "null"], minimum: 0 }
        imagen_url: { type: [string, "null"], description: "URL http(s) o data URL de imagen (data:image/webp;base64,…) de hasta ~1,5 MB; si no, 422 imagen_invalida" }
        frase_portada: { type: [string, "null"], maxLength: 90, description: "Frase corta y pública para la portada del carrusel. Si llega vacía, la API puede pedírsela al bot" }
        datos_ayuntamiento:
          $ref: "#/components/schemas/DatosAyuntamiento"
        estado: { enum: [cancelado, archivado] }

    Origen:
      type: object
      required: [canal, importado_auto]
      properties:
        canal: { enum: [whatsapp, web, panel, facebook, instagram, web_externa, manual, telegram] }
        url: { type: [string, "null"] }
        importado_auto: { type: boolean }

    ImportarEvento:
      type: object
      required: [extraccion, origen]
      description: |
        Hace falta `contacto_publicador`, `telefono_publicador` o `publicador_id` (o un origen.url de una fuente conocida).
        El publicador se busca por la fuente (origen.url), luego por `publicador_id` y luego por el contacto del remitente
        en su canal (teléfono o `telegram_id`; en Telegram, también por el teléfono del usuario vinculado).
      properties:
        extraccion: { $ref: "./schemas/extraccion_evento.json" }
        contacto_publicador: { $ref: "#/components/schemas/Contacto" }
        telefono_publicador:
          $ref: "#/components/schemas/Telefono"
          description: |
            E.164. Compatibilidad: la API también acepta aquí `tg:<chat_id>` (lo que envía hoy el bot de Telegram);
            lo nuevo debe ir en `contacto_publicador`.
        publicador_id: { type: [string, "null"], format: uuid }
        origen: { $ref: "#/components/schemas/Origen" }

    ResultadoImportacion:
      type: object
      required: [evento, faltan, duplicado]
      properties:
        evento: { $ref: "./schemas/evento.json" }
        faltan: { type: array, items: { type: string } }
        duplicado: { type: boolean, description: true = mismo origen.url, no se ha creado nada }
        posible_duplicado_de: { type: [string, "null"], format: uuid, description: Evento parecido (título + fecha + municipio) }

    ConfirmarEvento:
      type: object
      properties:
        campos:
          type: object
          description: Valores que faltaban o que el publicador corrige (mismos nombres que EventoCrear, incluida `frase_portada`)
          additionalProperties: true
        confirmado_por: { enum: [whatsapp, web, telegram] }

    MeGustaEstado:
      type: object
      required: [total, mio]
      properties:
        total: { type: integer, minimum: 0, description: Número de «me gusta» del plan }
        mio: { type: boolean, description: Si el usuario de la sesión ya le ha dado }
    CocheRespuesta:
      type: object
      additionalProperties: false
      required: [acepta]
      properties:
        usuario_id: { type: string, format: uuid, description: "Obligatorio con X-Internal-Token (el bot responde por el vecino)" }
        acepta: { type: boolean }
    InscripcionCrear:
      type: object
      properties:
        usuario_id: { type: string, format: uuid, description: Solo con X-Internal-Token (el bot inscribe en nombre del vecino) }
        plazas: { type: integer, minimum: 1, default: 1 }
        canal: { enum: [whatsapp, web, telegram] }

    MensajeCrear:
      type: object
      required: [texto]
      properties:
        texto: { type: string, minLength: 1, maxLength: 1000 }
        tipo: { enum: [pregunta, comentario, anuncio], default: comentario }
        en_respuesta_a: { type: [string, "null"], format: uuid }
        imagen_url: { type: [string, "null"], description: "Foto del plan, solo en comentarios de planes ya pasados y solo de inscritos o de la organización (si no, 403 sin_permiso). URL o data URL de imagen" }
        usuario_id: { type: string, format: uuid, description: Solo con X-Internal-Token }

    Recomendacion:
      type: object
      required: [evento, puntuacion, motivo]
      properties:
        evento: { $ref: "./schemas/evento.json" }
        puntuacion: { type: number }
        motivo: { type: string, examples: ["Te gusta el senderismo, está a 4 km y quedan 8 plazas"] }
        distancia_km: { type: [number, "null"] }

    Decision:
      type: object
      required: [decision]
      properties:
        decision:
          enum: [aprobar, rechazar, retirar, restaurar]
          description: "`aprobar` y `rechazar` desde `en_revision`; `retirar` desde `publicado` (pasa a `archivado`); `restaurar` desde `rechazado` (vuelve a `en_revision`, a la bandeja, sin avisar al publicador)."
        motivo:
          type: [string, "null"]
          description: "Motivo que se guarda en el evento y se manda al publicador. En `retirar` es opcional (por defecto «Retirado por moderación»)."

    PublicadorCrear:
      type: object
      required: [nombre, tipo, municipio, telefono]
      properties:
        nombre: { type: string, minLength: 2 }
        tipo: { enum: [asociacion, ayuntamiento, bar_restaurante, comercio, otro] }
        municipio: { type: string }
        descripcion: { type: [string, "null"] }
        telefono: { $ref: "#/components/schemas/Telefono" }
        email: { type: [string, "null"], format: email }
        responsable:
          type: [object, "null"]
          description: |
            PRIVADO (dato personal). Responsable de la entidad, lo pide el bot en el alta. Se guarda lo mínimo y solo
            lo ven los moderadores. `identidad_verificada` no se envía aquí (si llega, se ignora): la marca el
            moderador con `POST /publicadores/{id}/verificar-identidad`. Sin estos datos nunca podrá llegar al nivel 2.
          properties:
            nombre: { type: string, maxLength: 120 }
            dni: { type: string, maxLength: 20, description: DNI o NIE }
            residencia: { type: string, maxLength: 200, description: Pueblo o dirección donde vive }
            edad: { type: [integer, "null"], minimum: 14, maximum: 120, description: "P4a. Años. Opcional. Menos de 14: 422 `edad_minima` (en España hace falta tener 14 para dar el consentimiento de datos, LOPDGDD art. 7); más de 120: 422 `validacion`" }

    UsuarioCrear:
      type: object
      required: [telefono]
      properties:
        telefono: { $ref: "#/components/schemas/Telefono" }
        nombre: { type: string }
        municipio: { type: [string, "null"] }
        edad: { type: [integer, "null"], minimum: 14, maximum: 120, description: "P4a. Años. Opcional. Menos de 14: 422 `edad_minima` (en España hace falta tener 14 para dar el consentimiento de datos, LOPDGDD art. 7); más de 120: 422 `validacion`" }

    UsuarioVincular:
      type: object
      required: [telefono, contacto]
      description: Vincula el contacto de un canal (p. ej. Telegram tras «Compartir mi número») con el teléfono.
      properties:
        telefono: { $ref: "#/components/schemas/Telefono" }
        contacto: { $ref: "#/components/schemas/Contacto" }
        nombre: { type: string, description: Solo se usa si se crea el usuario }
        municipio: { type: [string, "null"], description: Solo se usa si se crea el usuario }
        edad: { type: [integer, "null"], minimum: 14, maximum: 120, description: "P4a. Solo se usa si se crea el usuario. Años. Opcional. Menos de 14: 422 `edad_minima` (en España hace falta tener 14 para dar el consentimiento de datos, LOPDGDD art. 7); más de 120: 422 `validacion`" }

    UsuarioEditar:
      type: object
      properties:
        nombre: { type: string }
        municipio: { type: [string, "null"] }
        lat: { type: [number, "null"] }
        lon: { type: [number, "null"] }
        gustos: { type: array, items: { $ref: "#/components/schemas/Categoria" } }
        etiquetas_interes: { type: array, items: { type: string } }
        formato_aviso: { enum: [texto, audio] }
        acepta_avisos: { type: boolean }
        radio_km: { type: [number, "null"], minimum: 0 }
        telefono: { $ref: "#/components/schemas/Telefono" }
        edad: { type: [integer, "null"], minimum: 14, maximum: 120, description: "P4a. Años. Opcional. Menos de 14: 422 `edad_minima` (en España hace falta tener 14 para dar el consentimiento de datos, LOPDGDD art. 7); más de 120: 422 `validacion`" }

    Token:
      type: object
      required: [access_token, token_type, usuario]
      properties:
        access_token: { type: string }
        token_type: { const: bearer }
        usuario: { $ref: "./schemas/usuario.json" }

    DatosAyuntamiento:
      type: [object, "null"]
      description: |
        PRIVADO. Datos de la propuesta para el ayuntamiento (evento.datos_ayuntamiento): solo los ven el organizador
        del evento y los moderadores. Mismos nombres que DatosAyuntamiento de apps/web/src/api/types.ts
        (si la web manda además `frase_portada` aquí, la API la ignora; va en EventoCrear.frase_portada).
      properties:
        responsable: { type: string, maxLength: 120 }
        telefono: { type: string, maxLength: 20 }
        entidad: { enum: [particular, asociacion, comercio, otra, ayuntamiento], description: "`ayuntamiento` cuando lo crea el propio ayuntamiento desde el panel (22/11)" }
        entidad_nombre: { type: [string, "null"], maxLength: 120 }
        publico: { enum: [todos, infantil, adultos, mayores] }
        necesidades:
          type: array
          items: { enum: [espacio, calle, material, luz, musica, comida, seguridad, limpieza, difusion] }
        seguro_rc: { enum: [si, no, nose] }
        observaciones: { type: [string, "null"], maxLength: 1000 }
        area: { type: [string, "null"], maxLength: 120, description: "Solo ayuntamientos: concejalía o área que lo organiza (Cultura, Deportes, Fiestas…)" }
        espacio_reservado: { type: [boolean, "null"], description: "Solo ayuntamientos: el espacio municipal ya está reservado para ese día" }
        accesible: { type: [boolean, "null"], description: "Solo ayuntamientos: el lugar es accesible para personas con movilidad reducida" }

    CaidaSimulada:
      type: object
      required: [activa]
      properties:
        activa: { type: boolean, description: true = todas las IAs «fallan» y el bot sigue solo con reglas }

    ParticipacionPlan:
      description: "N7/N8: cifras de participación de un plan (publicado o finalizado) para proponer otros"
      type: object
      required: [evento_id, titulo, categoria, municipio, fecha_inicio, inscritos, lista_espera, preguntas_chat]
      properties:
        evento_id: { type: string, format: uuid }
        titulo: { type: string }
        categoria: { $ref: "#/components/schemas/Categoria" }
        municipio: { type: string }
        fecha_inicio: { type: string, format: date-time }
        estado: { $ref: "#/components/schemas/EstadoEvento" }
        plazas_totales: { type: [integer, "null"], minimum: 0 }
        inscritos: { type: integer, minimum: 0, description: "Personas (suma de plazas) confirmadas o que asistieron" }
        lista_espera: { type: integer, minimum: 0 }
        asistencias: { type: integer, minimum: 0 }
        ocupacion: { type: [number, "null"], minimum: 0, maximum: 1, description: "plazas ocupadas / plazas_totales (en los planes ya hechos incluye a quien se apuntó fuera de la plataforma; nunca menos que inscritos / plazas_totales); null sin aforo" }
        preguntas_chat: { type: integer, minimum: 0, description: "Mensajes de tipo pregunta en el chat del evento" }

    SugerenciaPlan:
      description: "N7: plan nuevo propuesto por la IA (una de las `propuestas` de bot POST /ai/sugerir-eventos). Una persona decide si se crea"
      type: object
      required: [titulo, categoria, municipio, motivo]
      properties:
        titulo: { type: string, minLength: 1, maxLength: 120 }
        descripcion: { type: [string, "null"] }
        categoria: { $ref: "#/components/schemas/Categoria" }
        municipio: { type: string }
        fecha_aproximada: { type: [string, "null"], description: "Texto libre: «primavera», «mayo de 2027», «el próximo puente»" }
        motivo: { type: string, minLength: 1, description: "Por qué, con cifras reales de los planes de basado_en" }
        basado_en: { type: array, items: { type: string, format: uuid }, description: "evento_id de los planes que la justifican" }

    BorradorSugerencia:
      description: "N7: [Crear borrador]. La propuesta tal cual más la fecha que elige el moderador"
      allOf:
        - { $ref: "#/components/schemas/SugerenciaPlan" }
        - type: object
          required: [fecha_inicio]
          properties:
            fecha_inicio: { type: string, format: date-time }

    Sugerencias:
      description: "N7: respuesta de GET /admin/sugerencias"
      type: object
      required: [items, basado_en, proveedor_ia]
      properties:
        items: { type: array, maxItems: 3, items: { $ref: "#/components/schemas/SugerenciaPlan" } }
        basado_en: { type: array, items: { $ref: "#/components/schemas/ParticipacionPlan" }, description: "Los planes con más participación que se pasaron a la IA" }
        proveedor_ia: { type: string, description: "Quién propuso (p. ej. freellm:…, nim:…, reglas)" }

    BusquedaIA:
      description: "RAG: cuerpo de POST /api/v1/buscar"
      type: object
      required: [pregunta]
      properties:
        pregunta: { type: string, minLength: 3, maxLength: 300 }
        limite: { type: integer, minimum: 1, maximum: 8, default: 6, description: "Máximo de planes en `items`" }

    PlanContexto:
      description: "RAG: plan recuperado que la API pasa a bot POST /ai/responder-agenda (sin datos privados)"
      type: object
      required: [evento_id, titulo, categoria, municipio, fecha_inicio]
      properties:
        evento_id: { type: string, format: uuid }
        titulo: { type: string }
        categoria: { $ref: "#/components/schemas/Categoria" }
        municipio: { type: string }
        lugar: { type: [string, "null"] }
        fecha_inicio: { type: string, format: date-time }
        fecha_fin: { type: [string, "null"], format: date-time }
        precio_eur: { type: [number, "null"] }
        es_gratuito: { type: boolean }
        plazas_libres: { type: [integer, "null"], description: "null sin aforo" }
        descripcion: { type: [string, "null"], maxLength: 600 }

    RespuestaBusqueda:
      description: "RAG: respuesta de POST /api/v1/buscar"
      type: object
      required: [respuesta, items, citados, recuperados, proveedor_ia, modo]
      properties:
        respuesta: { type: string, description: "Texto para la persona" }
        items:
          type: array
          items: { $ref: "./schemas/evento.json" }
          description: "Los planes citados primero, luego el resto de recuperados hasta `limite`"
        citados: { type: array, items: { type: string, format: uuid }, description: "evento_id de los planes que nombra la respuesta" }
        recuperados: { type: integer, minimum: 0, description: "Cuántos planes se pasaron como contexto («Basado en N planes»)" }
        proveedor_ia: { type: string, description: "Quién respondió (p. ej. nim:…, gemini:…, reglas)" }
        modo:
          enum: [rag, palabras]
          description: "`rag` = respuesta generada por IA con citas validadas; `palabras` = sin IA, plantilla"
        filtros:
          type: object
          description: "Lo que se entendió de la pregunta"
          properties:
            desde: { type: [string, "null"], format: date-time }
            hasta: { type: [string, "null"], format: date-time }
            municipio: { type: [string, "null"] }
            categorias: { type: array, items: { $ref: "#/components/schemas/Categoria" } }
            gratis: { type: boolean }
            ninos: { type: boolean }
    MetricasBot:
      type: object
      description: Lo que devuelve `bot GET /metrics` (services/bot/app/main.py). Schema abierto.
      additionalProperties: true
      properties:
        totales:
          type: object
          description: Acumulado por proveedor de IA
          additionalProperties:
            type: object
            properties:
              llamadas: { type: integer, minimum: 0 }
              entrada: { type: integer, minimum: 0, description: Tokens de entrada }
              salida: { type: integer, minimum: 0, description: Tokens de salida }
              fallos: { type: integer, minimum: 0 }
        ultimas:
          type: array
          description: Últimas llamadas a la IA (hasta 20)
          items: { $ref: "#/components/schemas/MetricaTokens" }
        eventos_en_cola: { type: integer, minimum: 0, description: Peticiones a la API pendientes en la cola del bot }
        caida_simulada: { type: boolean }

    MetricaTokens:
      type: object
      description: Lo que ya envía services/bot/app/metrics.py
      required: [proveedor, tarea, tokens_entrada, tokens_salida]
      properties:
        proveedor: { type: string }
        modelo: { type: string }
        tarea: { type: string }
        tokens_entrada: { type: integer, minimum: 0 }
        tokens_salida: { type: integer, minimum: 0 }
        latencia_ms: { type: integer, minimum: 0 }
        ok: { type: boolean }
        ts: { type: number, description: Epoch en segundos }

    Estadisticas:
      type: object
      properties:
        periodo:
          type: object
          properties:
            desde: { type: [string, "null"], format: date-time }
            hasta: { type: [string, "null"], format: date-time }
        actividades: { type: integer }
        pct_importadas_auto: { type: number, description: "Porcentaje en escala 0-100" }
        inscripciones: { type: integer }
        asistencias: { type: integer }
        ocupacion_por_categoria:
          type: object
          description: "Ocupación media por categoría, fracción en escala 0-1 (no porcentaje)"
          additionalProperties: { type: number, description: "0-1" }
        pct_otro_pueblo: { type: number, description: "Porcentaje en escala 0-100" }
        solapamientos:
          type: array
          items:
            type: object
            properties:
              evento_a: { type: string, format: uuid }
              evento_b: { type: string, format: uuid }
              motivo: { type: string }
        tokens:
          type: object
          properties:
            por_proveedor:
              type: object
              additionalProperties:
                type: object
                properties:
                  llamadas: { type: integer }
                  entrada: { type: integer }
                  salida: { type: integer }
                  coste_eur: { type: number }
            coste_total_eur: { type: number }
