        "422": { $ref: "#/components/responses/Error", description: "422 `validacion`" }
        "429": { $ref: "#/components/responses/Error", description: "429 `demasiados_intentos`: 5 fallos desde la misma IP (o 30 en total) en 10 minutos; `details.reintentar_en_s`" }
