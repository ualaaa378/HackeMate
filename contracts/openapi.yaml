  /api/v1/auth/admin:
    post:
      tags: [auth]
      summary: "Acceso de la moderación del ayuntamiento con usuario y contraseña"
      description: |
        Comprueba `usuario` y `contrasena` contra `ADMIN_USUARIO` y `ADMIN_CONTRASENA` del `.env` (provisional para
        la demo: `admin` / `1234`; cambiarla en la máquina de la demo) y devuelve la sesión del moderador más antiguo.
        Funciona con y sin `DEMO_MODE`. La web lo pide para entrar en la pestaña de administración (`/admin`).
