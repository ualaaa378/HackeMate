openapi: 3.1.0
info:
  title: HackeMate · contratos v1
  version: 1.0.0
  description: |
    API REST de `api` (Flujo A) y endpoints de `bot` (Flujo B) que llama la API.
    Convenciones (PLAN.md §5.2): snake_case en español, UUID v4, fechas ISO 8601 con zona,
    paginación `{items, total, page, size}` y errores `{"error": {code, message, details}}`.
    Los schemas de entidades viven en `schemas/*.json`.
    `Evento.inscritos` (inscripciones confirmadas) lo calcula la API; no se envía al crear ni al editar.
    Estado: v1 congelado en CP0. Los endpoints marcados `x-implementado: false` aún no existen.
    Ruta inexistente: cualquier ruta que la API no tiene responde 404 `{"error": {"code": "no_encontrado"}}`
    (manejador genérico). Cuando la ruta existe pero el recurso no, el código es propio (`evento_no_encontrado`,
    `publicador_no_encontrado`, `usuario_no_encontrado`…). El bot se basa en esa diferencia.
    Datos privados: `evento.datos_ayuntamiento` (solo organizador y moderadores) y `publicador.responsable` /
    `publicador.actividad` (solo moderadores) no aparecen nunca en las respuestas públicas.
servers:
  - url: http://localhost:8000
    description: api
  - url: http://localhost:8001
    description: bot

tags:
  - name: sistema
  - name: eventos
  - name: ingesta
  - name: inscripciones
  - name: chat
  - name: calendario
  - name: recomendaciones
  - name: moderacion
  - name: publicadores
  - name: auth
  - name: usuarios
  - name: estadisticas
  - name: admin
  - name: bot

security:
  - {}
  - bearer: []
  - interno: []

paths:
  /health:
    get:
      tags: [sistema]
      summary: Estado del servicio (api, bot y web)
      security: [{}]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /api/v1/municipios:
    get:
      tags: [eventos]
      summary: Los 5 pueblos con coordenadas
      security: [{}]
      x-implementado: true
      responses:
        "200":
          description: Lista de municipios
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Municipio" }

  /api/v1/choques:
    get:
      tags: [eventos]
      summary: >-
        Choque de fechas. Planes publicados el mismo día a 20 km o menos del pueblo (el mismo pueblo cuenta) y, si
        hay alguno, hasta 3 días libres del mismo tipo (laborable o fin de semana) a la misma hora. Lo usa el bot al
        confirmar un plan: la IA elige y redacta la propuesta y quien crea el plan decide.
      x-implementado: true
      parameters:
        - { name: fecha_inicio, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: municipio, in: query, required: true, schema: { type: string } }
        - { name: excluir, in: query, required: false, schema: { type: string, format: uuid }, description: "El propio plan (para no chocar consigo mismo)" }
      responses:
        "200":
          description: Choques y días libres
          content:
            application/json:
              schema:
                type: object
                required: [choques, alternativas]
                properties:
                  choques:
                    type: array
                    items:
                      type: object
                      required: [evento_id, titulo, municipio, fecha_inicio, distancia_km]
                      properties:
                        evento_id: { type: string, format: uuid }
                        titulo: { type: string }
                        municipio: { type: string }
                        fecha_inicio: { type: string, format: date-time }
                        distancia_km: { type: number }
                  alternativas:
                    type: array
                    items: { type: string, format: date-time }
        "422": { $ref: "#/components/responses/Error", description: "422 `validacion` (fecha sin zona o mal escrita) o `municipio_no_encontrado`" }

  /api/v1/lugares:
    get:
      tags: [eventos]
      summary: Información permanente de los pueblos (rutas, sitios, comercios, alojamientos, servicios)
      security: [{}]
      x-implementado: true
      parameters:
        - { name: municipio, in: query, schema: { type: string } }
        - { name: tipo, in: query, schema: { enum: [ruta, sitio_interes, comercio, alojamiento, servicio] } }
        - { name: lat, in: query, schema: { type: number } }
        - { name: lon, in: query, schema: { type: number } }
        - { name: radio_km, in: query, schema: { type: number, minimum: 0 } }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Página de lugares
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginaLugares" }

  /api/v1/lugares/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [eventos]
      summary: Ficha de un lugar
      security: [{}]
      x-implementado: true
      responses:
        "200":
          description: Lugar
          content:
            application/json:
              schema: { $ref: "./schemas/lugar.json" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/eventos:
    get:
      tags: [eventos]
      summary: Agenda y mapa. Público solo ve `publicado`.
      description: |
        Sin sesión, el público ve `publicado` (por defecto) y también puede pedir `estado=finalizado`
        (planes ya pasados, para la pestaña «Recuerdos»). Los demás estados solo los ven el moderador
        y el publicador (sus eventos). `datos_ayuntamiento` nunca aparece en esta lista pública.
      security: [{}]
      x-implementado: true
      parameters:
        - { name: municipio, in: query, schema: { type: string } }
        - { name: categoria, in: query, schema: { $ref: "#/components/schemas/Categoria" } }
        - { name: desde, in: query, schema: { type: string, format: date-time } }
        - { name: hasta, in: query, schema: { type: string, format: date-time } }
        - { name: lat, in: query, schema: { type: number } }
        - { name: lon, in: query, schema: { type: number } }
        - { name: radio_km, in: query, schema: { type: number, minimum: 0 } }
        - { name: q, in: query, description: Texto libre en título y descripción, schema: { type: string } }
        - name: estado
          in: query
          description: Por defecto `publicado`. Sin sesión también se admite `finalizado` (planes pasados, «Recuerdos»). Los demás estados, solo moderador y publicador (sus eventos).
          schema: { $ref: "#/components/schemas/EstadoEvento" }
        - { name: publicador_id, in: query, schema: { type: string, format: uuid } }
        - name: organizador_id
          in: query
          description: |
            P5a, «Mis planes propuestos» (opcional). Id del usuario: los planes que propuso (`propuesto_por_id`) o los de sus
            entidades, en todos los estados salvo `borrador` (o solo en `estado`, si se manda), los más recientes primero.
            Solo para el propio usuario, un moderador o el servicio interno (el bot); para otro, la lista sale vacía.
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Página de eventos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginaEventos" }
        "422": { $ref: "#/components/responses/Error" }
    post:
      tags: [eventos]
      summary: Crear evento a mano (publicador o moderador)
      x-implementado: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventoCrear" }
      responses:
        "201":
          description: Creado
          content:
            application/json:
              schema: { $ref: "./schemas/evento.json" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error", description: "422 `validacion` o `imagen_invalida` (imagen_url no es URL http(s) ni data URL de imagen, o pasa de ~1,5 MB)" }

  /api/v1/eventos/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [eventos]
      summary: Ficha del evento
      description: "`datos_ayuntamiento` solo aparece si quien pide es el organizador del evento o un moderador (con sesión bearer)."
      security: [{}]
      x-implementado: true
      responses:
        "200":
          description: Evento
          content:
            application/json:
              schema: { $ref: "./schemas/evento.json" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [eventos]
      summary: Editar evento. Si cambia `fecha_inicio`, avisa a todos los inscritos (`cambio_evento`) y fija un anuncio.
      x-implementado: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventoEditar" }
      responses:
        "200":
          description: Evento actualizado
          content:
            application/json:
              schema: { $ref: "./schemas/evento.json" }
        "401": { $ref: "#/components/responses/Error", description: "401 `no_autenticado`, `token_invalido` o `token_caducado` (sin sesión ni X-Internal-Token, o sesión no válida)" }
        "403": { $ref: "#/components/responses/Error", description: "403 `prohibido` (solo el organizador del evento o un moderador)" }
        "404": { $ref: "#/components/responses/Error", description: "404 `evento_no_encontrado`" }
        "422": { $ref: "#/components/responses/Error", description: "422 `validacion`, `fechas_invalidas` (fecha_fin anterior a fecha_inicio) o `imagen_invalida` (imagen_url no es URL http(s) ni data URL de imagen, o pasa de ~1,5 MB)" }

  /api/v1/eventos/importar:
    post:
      tags: [ingesta]
      summary: El bot entrega una ExtraccionEvento + origen. Crea el evento en `pendiente_confirmacion`.
      description: Si ya existe un evento con el mismo `origen.url`, devuelve ese (`duplicado = true`) y no crea otro.
      security: [{ interno: [] }]
      x-implementado: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportarEvento" }
      responses:
        "201":
          description: Evento creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResultadoImportacion" }
        "200":
          description: Ya existía (mismo origen.url)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResultadoImportacion" }
        "401": { $ref: "#/components/responses/Error", description: "401 `token_interno_invalido` (falta X-Internal-Token o no es correcto)" }
        "403": { $ref: "#/components/responses/Error", description: "403 `publicador_pausado` o `publicador_rechazado` (la solicitud del publicador fue rechazada)" }
        "422": { $ref: "#/components/responses/Error", description: "422 `validacion`, `no_es_evento`, `publicador_no_encontrado` o `municipio_no_encontrado`" }

  /api/v1/eventos/{id}/confirmar:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [ingesta]
      summary: El publicador completa lo que falta y confirma. Pasa a moderación (`en_revision` o `publicado` según nivel).
      security: [{ bearer: [] }, { interno: [] }]
      x-implementado: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfirmarEvento" }
      responses:
        "200":
          description: Evento tras la moderación automática
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResultadoImportacion" }
        "401": { $ref: "#/components/responses/Error", description: "401 `token_interno_invalido` (falta X-Internal-Token o no es correcto)" }
        "403": { $ref: "#/components/responses/Error", description: "403 `publicador_pausado` o `publicador_rechazado`" }
        "404": { $ref: "#/components/responses/Error", description: "404 `evento_no_encontrado`" }
        "409": { $ref: "#/components/responses/Error", description: "409 `estado_invalido` (el evento no está en `pendiente_confirmacion`)" }
        "422": { $ref: "#/components/responses/Error", description: "422 `faltan_campos` (details.faltan), `validacion`, `municipio_no_encontrado` o `fechas_invalidas`" }

  /api/v1/eventos/{id}/apelacion:
    post:
      tags: [moderacion]
      summary: "P3a: el organizador pide que se revise otra vez un plan rechazado (una sola vez)"
      description: |
        Solo quien propuso el plan: el responsable de su publicador o el vecino que lo propuso (con su sesión), o el
        bot en su nombre (`X-Internal-Token` + `usuario_id`). Solo si el plan está `rechazado` y **una vez**: el
        plan vuelve a `en_revision`, a la bandeja, con el motivo «Apelación: {motivo}» y guarda `apelacion` en el
        evento. El moderador decide con los botones de siempre; un segundo rechazo es definitivo (no se puede
        volver a apelar). El aviso de rechazo al publicador lleva `evento_id`, para que el bot ponga [Apelar].
      security: [{ bearer: [] }, { interno: [] }]
      x-implementado: true
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo]
              properties:
                motivo: { type: string, minLength: 10, maxLength: 500, description: "Por qué debería publicarse" }
                usuario_id: { type: string, format: uuid, description: "Obligatorio con X-Internal-Token (el bot): quién apela" }
      responses:
        "200":
          description: El plan vuelve a la bandeja
          content:
            application/json:
              schema: { $ref: "./schemas/evento.json" }
        "401": { $ref: "#/components/responses/Error", description: "401 `no_autenticado`" }
        "403": { $ref: "#/components/responses/Error", description: "403 `prohibido` (no es quien propuso el plan)" }
        "404": { $ref: "#/components/responses/Error", description: "404 `evento_no_encontrado`" }
        "409": { $ref: "#/components/responses/Error", description: "409 `estado_invalido` (no está rechazado) o `apelacion_usada` (ya apeló una vez)" }
        "422": { $ref: "#/components/responses/Error", description: "422 `validacion` (motivo de menos de 10 o más de 500 caracteres)" }

  /api/v1/eventos/{id}/inscripciones:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [inscripciones]
      summary: Lista de inscritos (solo organizador y moderador)
      x-implementado: true
      responses:
        "200":
          description: Inscripciones
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "./schemas/inscripcion.json" }
        "401": { $ref: "#/components/responses/Error", description: "401 `no_autenticado`, `token_invalido` o `token_caducado` (sin sesión ni X-Internal-Token, o sesión no válida)" }
        "403": { $ref: "#/components/responses/Error", description: "403 `prohibido` (solo el organizador del evento o un moderador)" }
        "404": { $ref: "#/components/responses/Error", description: "404 `evento_no_encontrado`" }
    post:
      tags: [inscripciones]
      summary: Apuntarse. Si no hay plazas, queda en `lista_espera`. Si el plan ya ha terminado, 409 `evento_finalizado`.
      security: [{ bearer: [] }, { interno: [] }]
      x-implementado: true
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InscripcionCrear" }
      responses:
        "201":
          description: Inscripción
          content:
            application/json:
              schema: { $ref: "./schemas/inscripcion.json" }
        "401": { $ref: "#/components/responses/Error", description: "401 `no_autenticado`, `token_invalido` o `token_caducado` (sin sesión ni X-Internal-Token, o sesión no válida)" }
        "403": { $ref: "#/components/responses/Error", description: "403 `prohibido` (con sesión solo puedes inscribirte a ti mismo)" }
        "404": { $ref: "#/components/responses/Error", description: "404 `evento_no_encontrado` o `usuario_no_encontrado`" }
        "409": { $ref: "#/components/responses/Error", description: "409 `ya_inscrito` (details.inscripcion_id), `evento_no_inscribible` (el evento no está publicado) o `evento_terminado`" }
        "422": { $ref: "#/components/responses/Error", description: "422 `falta_usuario_id` (con X-Internal-Token hay que indicar usuario_id) o `validacion`" }

  /api/v1/eventos/{id}/inscripciones/{insc_id}:
    parameters:
      - $ref: "#/components/parameters/Id"
      - { name: insc_id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [inscripciones]
      summary: Cancelar. El primero de la lista de espera sube a `confirmada` y se le avisa.
      security: [{ bearer: [] }, { interno: [] }]
      x-implementado: true
      responses:
        "200":
          description: Inscripción cancelada
          content:
            application/json:
              schema: { $ref: "./schemas/inscripcion.json" }
        "401": { $ref: "#/components/responses/Error", description: "401 `no_autenticado`, `token_invalido` o `token_caducado` (sin sesión ni X-Internal-Token, o sesión no válida)" }
        "403": { $ref: "#/components/responses/Error", description: "403 `prohibido` (solo quien se apuntó, el organizador o un moderador)" }
        "404": { $ref: "#/components/responses/Error", description: "404 `evento_no_encontrado` o `inscripcion_no_encontrada`" }
        "409": { $ref: "#/components/responses/Error", description: "409 `inscripcion_cerrada` (ya se marcó la asistencia)" }
    patch:
      tags: [inscripciones]
      summary: Marcar asistencia (organizador o moderador)
      x-implementado: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estado]
              properties:
                estado: { enum: [asistio, no_asistio] }
      responses:
        "200":
          description: Inscripción
          content:
            application/json:
              schema: { $ref: "./schemas/inscripcion.json" }
        "401": { $ref: "#/components/responses/Error", description: "401 `no_autenticado`, `token_invalido` o `token_caducado` (sin sesión ni X-Internal-Token, o sesión no válida)" }
        "403": { $ref: "#/components/responses/Error", description: "403 `prohibido` (solo el organizador del evento o un moderador)" }
        "404": { $ref: "#/components/responses/Error", description: "404 `evento_no_encontrado` o `inscripcion_no_encontrada`" }
        "409": { $ref: "#/components/responses/Error", description: "409 `inscripcion_sin_plaza` (solo se marca la asistencia de quien tenía plaza)" }
        "422": { $ref: "#/components/responses/Error", description: "422 `validacion`" }

  /api/v1/eventos/{id}/coche:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [inscripciones]
      summary: >-
        Compartir coche. El vecino (apuntado con plaza a un plan de otro pueblo) dice si quiere ir con los de su
        pueblo. Con un sí, si otro vecino del mismo pueblo ya dijo que sí, se avisa a los dos con el contacto.
        Nunca se pasa el contacto de quien no ha dicho que sí.
      security: [{ bearer: [] }, { interno: [] }]
      x-implementado: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CocheRespuesta" }
      responses:
        "200":
          description: Respuesta guardada
          content:
            application/json:
              schema:
                type: object
                required: [respuesta, companeros]
                properties:
                  respuesta: { enum: [si, no] }
                  companeros:
                    type: array
                    description: Contacto de los vecinos del mismo pueblo que ya dijeron que sí («Nombre (+34…)»)
                    items: { type: string }
        "401": { $ref: "#/components/responses/Error", description: "401 `no_autenticado`, `token_invalido` o `token_caducado`" }
        "403": { $ref: "#/components/responses/Error", description: "403 `prohibido` (con sesión solo respondes por ti)" }
        "404": { $ref: "#/components/responses/Error", description: "404 `evento_no_encontrado` o `usuario_no_encontrado`" }
        "409": { $ref: "#/components/responses/Error", description: "409 `coche_no_disponible` (no está apuntado con plaza, vive en el pueblo del plan o el plan ya no está publicado)" }
        "422": { $ref: "#/components/responses/Error", description: "422 `falta_usuario_id` o `validacion`" }

  /api/v1/eventos/{id}/me-gusta:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [eventos]
      summary: Cuántos «me gusta» tiene el plan y si el usuario de la sesión ya le ha dado (sin sesión, mio=false)
      security: [{}, { bearer: [] }]
      x-implementado: true
      responses:
        "200":
          description: Estado del «me gusta»
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeGustaEstado" }
        "404": { $ref: "#/components/responses/Error", description: "404 `evento_no_encontrado`" }
    put:
      tags: [eventos]
      summary: Dar «me gusta» al plan (solo con cuenta; repetirlo no suma otra vez)
      security: [{ bearer: [] }]
      x-implementado: true
      responses:
        "200":
          description: Estado del «me gusta» tras darlo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeGustaEstado" }
        "401": { $ref: "#/components/responses/Error", description: "401 `no_autenticado`" }
        "404": { $ref: "#/components/responses/Error", description: "404 `evento_no_encontrado`" }
    delete:
      tags: [eventos]
      summary: Quitar el «me gusta» del usuario de la sesión
      security: [{ bearer: [] }]
      x-implementado: true
      responses:
        "200":
          description: Estado del «me gusta» tras quitarlo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeGustaEstado" }
        "401": { $ref: "#/components/responses/Error", description: "401 `no_autenticado`" }
        "404": { $ref: "#/components/responses/Error", description: "404 `evento_no_encontrado`" }

  /api/v1/eventos/{id}/mensajes:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [chat]
      summary: Chat del evento. Anuncios fijados primero. Nunca expone teléfonos.
      security: [{}]
      x-implementado: true
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Mensajes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginaMensajes" }
        "401": { $ref: "#/components/responses/Error", description: "401 `token_invalido` o `token_caducado` (se envió una sesión no válida; sin sesión es público)" }
        "404": { $ref: "#/components/responses/Error", description: "404 `evento_no_encontrado`" }
    post:
      tags: [chat]
      summary: Publicar mensaje. Pasa por `bot /ai/spam`; si es pregunta, `bot /ai/responder-ficha`. Con el plan terminado solo se admiten comentarios (si no, 409 `evento_finalizado`).
      security: [{ bearer: [] }, { interno: [] }]
      x-implementado: true
      requestBody:
